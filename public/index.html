<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #app {
            width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            line-height: 1.4;
        }

        .username {
            color: #4fc3f7;
            margin-right: 8px;
        }

        #bottom {
            display: flex;
            border-top: 1px solid #333;
        }

        #input {
            flex: 1;
            background: #2a2a2a;
            border: none;
            padding: 12px 16px;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 14px;
            outline: none;
        }

        #send {
            background: #2a2a2a;
            border: none;
            border-left: 1px solid #333;
            padding: 12px 20px;
            color: #4fc3f7;
            font-family: monospace;
            cursor: pointer;
        }

        #send:hover {
            background: #333;
        }

        #username-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #username-input {
            background: #2a2a2a;
            border: 1px solid #333;
            padding: 10px 16px;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 14px;
            outline: none;
            width: 250px;
        }

        #join-btn {
            background: #2a2a2a;
            border: 1px solid #333;
            padding: 10px 24px;
            color: #4fc3f7;
            font-family: monospace;
            cursor: pointer;
        }

        #join-btn:hover {
            background: #333;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="username-screen">
        <p>enter a username to join</p>
        <input id="username-input" type="text" placeholder="username" />
        <button id="join-btn">join</button>
    </div>

    <div id="app" class="hidden">
        <div id="messages"></div>
        <div id="bottom">
            <input id="input" type="text" placeholder="type a message..." />
            <button id="send">send</button>
        </div>
    </div>

    <script>
        let username = ''
        let ws

        const usernameScreen = document.getElementById('username-screen')
        const app = document.getElementById('app')
        const messagesDiv = document.getElementById('messages')
        const input = document.getElementById('input')
        const sendBtn = document.getElementById('send')
        const usernameInput = document.getElementById('username-input')
        const joinBtn = document.getElementById('join-btn')

        joinBtn.addEventListener('click', function() {
            const val = usernameInput.value.trim()
            if (val === '') return
            username = val
            joinBtn.disabled = true
            usernameScreen.classList.add('hidden')
            app.classList.remove('hidden')
            connectWebSocket()
        })

        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') joinBtn.click()
        })

        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return
            ws = new WebSocket('ws://localhost:3000')
            
            ws.addEventListener('open', function() {
                appendMessage('system', 'connected to server')
            })

            ws.addEventListener('message', function(event) {
                const data = JSON.parse(event.data)
                appendMessage(data.username, data.text)
            })

            ws.addEventListener('close', function() {
                appendMessage('system', 'disconnected from server')
            })
        }

        function appendMessage(user, text) {
            const div = document.createElement('div')
            div.classList.add('message')
            div.innerHTML = '<span class="username">' + user + '</span>' + text
            messagesDiv.appendChild(div)
            messagesDiv.scrollTop = messagesDiv.scrollHeight
        }

        sendBtn.addEventListener('click', sendMessage)

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage()
        })

        function sendMessage() {
            const text = input.value.trim()
            if (text === '' || !ws) return
            const payload = JSON.stringify({ username: username, text: text })
            ws.send(payload)
            input.value = ''
        }
    </script>
</body>
</html>
